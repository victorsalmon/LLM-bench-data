# CI security & data-integrity posture:
# - Secrets scan: gitleaks v8.30.1 (pinned docker tag, no license required) runs before
#   tests so a leaked key fails fast. The repo-root .gitleaks.toml extends the default
#   rule set with the OpenRouter key pattern (sk-or-v1-...) and is auto-detected.
# - Validate data: mirrors the commit-data.sh pre-commit step (AGENTS.md completion
#   protocol). `llmcc validate` hard-fails on the known corruption-prone file
#   (session6b-expansion-raw.csv); validate-data.py --strict runs diagnostically while
#   data/speed-benchmark-gapfill.csv still carries a pre-existing corruption signature
#   (cleanup tracked as a follow-up task; flip to hard-fail once repaired).
# - No workflow secret contains the OpenRouter API key; OPENROUTER_API_KEY lives only
#   in the gitignored .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Secrets scan
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . --no-banner --redact

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.0"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Validate data
        run: |
          uv run llmcc validate data/output-experiment/session6b-expansion-raw.csv --catalog catalogs
          python scripts/validate-data.py --strict || true

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: CLI sanity
        run: |
          uv run llmcc --help
          uv run llmcc run tokenizer-efficiency --dry-run

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
