# CI security & data-integrity posture:
# - Actions are pinned to immutable commit SHAs (release tag in the trailing comment)
#   so a retagged or compromised release cannot silently change what runs.
# - Secrets scan: gitleaks v8.30.1 (pinned docker tag, no license required) runs before
#   tests so a leaked key fails fast. The repo-root .gitleaks.toml extends the default
#   rule set with the OpenRouter key pattern (sk-or-v1-...) and is auto-detected.
# - Validate data: mirrors the commit-data.sh validation step (AGENTS.md completion
#   protocol). `llmcc validate` hard-fails on the known corruption-prone file
#   (session6b-expansion-raw.csv) and validate-data.py --strict is hard-failing too.
#   --strict passes because the remaining non-success rows are explicit policy, not
#   leaks: raw capture files are matched by the documented `*-raw.csv` rule, terminal
#   `maxed_at_*` rows are measured results, and the single merged-file row is a named
#   exemption carrying its reason (see scripts/validate-data.py). A non-exempt
#   non-success row still fails the step.
# - No workflow secret contains the OpenRouter API key; OPENROUTER_API_KEY lives only
#   in the gitignored .env.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Secrets scan
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: detect --source . --no-banner --redact

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Validate data
        run: |
          uv run llmcc validate data/output-experiment/session6b-expansion-raw.csv --catalog catalogs
          python scripts/validate-data.py --strict

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: CLI sanity
        run: |
          uv run llmcc --help
          uv run llmcc run tokenizer-efficiency --dry-run

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
